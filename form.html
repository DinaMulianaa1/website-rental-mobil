<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulir penyewaan mobil RodaRental.">
  <title>Form Penyewaan | Rental Mobil</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Roda<span>Rental</span></a>
    <nav aria-label="Navigasi utama">
      <a href="index.html">Beranda</a>
      <a href="katalog_011.html">Katalog Mobil</a>
      <a class="active" href="form.html">Form Penyewaan</a>
    </nav>
  </header>

  <main class="section form-section">
    <div class="section-heading">
      <p class="eyebrow">MULAI PEMESANAN</p>
      <h1>Form Penyewaan Mobil</h1>
      <p>Lengkapi seluruh data berikut. Kolom bertanda * wajib diisi.</p>
    </div>

    <form id="rentalForm" class="rental-form" novalidate>
      <div class="form-group">
    <label for="nama">Nama Lengkap *</label>

    <input
        type="text"
        id="nama"
        name="nama"
        placeholder="Contoh: Dina 123"
        required
    >

    <small>
        Gunakan nama Anda yang diikuti 3 digit terakhir NIM.
        Contoh: Dina 123.
    </small>

    <small class="error" id="namaError"></small>
</div>


      <div class="form-group">
        <label for="mobil">Pilihan Mobil *</label>
        <select id="mobil" name="mobil" required>
          <option value="">-- Pilih mobil --</option>
          <option value="Toyota Avanza">Toyota Avanza</option>
          <option value="Honda Brio">Honda Brio</option>
          <option value="Toyota Innova">Toyota Innova</option>
        </select>
        <small class="error" id="mobilError"></small>
      </div>

      <div class="form-group">
        <label for="lama">Lama Sewa (hari) *</label>
        <input type="number" id="lama" name="lama" min="1" step="1" placeholder="Minimal 1 hari" required>
        <small class="error" id="lamaError"></small>
      </div>

      <button class="button submit-button" type="submit">Kirim Permintaan Sewa</button>
      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer><p>© 2026 RodaRental — Website Studi Kasus Penyewaan Mobil.</p></footer>
</body>
</html>
